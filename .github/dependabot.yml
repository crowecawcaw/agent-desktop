version: 2

updates:
  - package-ecosystem: cargo
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 1
    groups:
      cargo:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - minor
          - patch
          - major
      cargo-security:
        applies-to: security-updates
        patterns:
          - "*"
        update-types:
          - minor
          - patch
          - major

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 1
    groups:
      github-actions:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - minor
          - patch
          - major
      github-actions-security:
        applies-to: security-updates
        patterns:
          - "*"
        update-types:
          - minor
          - patch
          - major
